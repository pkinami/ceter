<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceter Technologies — Interactive Admin Architecture Mockup</title>
<style>
:root{
  --navy:#0b1f3a; --navy2:#102b4d; --teal:#11b8ae; --teal2:#0d9f97;
  --bg:#f5f8fb; --panel:#fff; --line:#dce4ec; --line2:#edf1f5;
  --text:#15233a; --muted:#69778c; --green:#159947; --red:#dc3f45;
  --amber:#d68100; --blue:#2468d8; --shadow:0 1px 3px rgba(9,30,66,.06);
  --radius:9px; --topbar:72px; --rail:72px; --sidewide:244px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* Header */
.topbar{height:var(--topbar);background:var(--navy);color:#fff;position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-zone{width:286px;display:flex;align-items:center;padding:0 22px;flex:none}
.logo-zone img{height:43px;max-width:210px;object-fit:contain}
.global-zone{flex:1;display:flex;align-items:center;gap:12px;padding:0 18px;min-width:0}
.global-search{position:relative;flex:1;max-width:560px}
.global-search input{width:100%;height:40px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:0 15px 0 38px;outline:0}
.global-search input::placeholder{color:#a9bbcf}
.search-symbol{position:absolute;left:13px;top:9px;color:#a9bbcf}
.search-results{position:absolute;left:0;right:0;top:45px;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 55px rgba(7,23,44,.2);max-height:420px;overflow:auto;z-index:100}
.search-result{padding:11px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
.search-result:hover{background:#f4fbfa}
.top-spacer{flex:1}
.top-chip{font-size:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);padding:7px 10px;border-radius:999px;white-space:nowrap}
.top-avatar{width:35px;height:35px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800}
.top-account{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}

/* Sidebar - compact rail that expands on hover */
.sidebar{position:fixed;top:var(--topbar);left:0;bottom:0;width:var(--rail);background:#0c223d;color:#dce8f5;z-index:40;transition:width .18s ease;overflow:hidden;border-right:1px solid rgba(255,255,255,.05)}
.sidebar:hover{width:var(--sidewide);box-shadow:12px 0 28px rgba(6,22,41,.12)}
.sidebar-scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:10px 8px 16px}
.nav-group-label{height:26px;display:flex;align-items:center;padding-left:13px;color:#7fa3c7;font-size:9px;letter-spacing:1.3px;white-space:nowrap;opacity:0;transition:opacity .12s}
.sidebar:hover .nav-group-label{opacity:1}
.nav-item{height:42px;width:100%;display:flex;align-items:center;border:0;background:transparent;color:#d8e5f2;border-radius:8px;margin:2px 0;padding:0 12px;white-space:nowrap;text-align:left;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:#123252;color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.nav-icon{width:32px;min-width:32px;height:24px;display:grid;place-items:center;color:#9ec3e4}
.nav-item.active .nav-icon{color:var(--teal)}
.nav-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-label{font-size:12.5px;font-weight:600;opacity:0;transition:opacity .08s}
.sidebar:hover .nav-label{opacity:1}
.nav-count{margin-left:auto;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:12px;font-size:10px;opacity:0}
.sidebar:hover .nav-count{opacity:1}

/* Main */
.main{margin-left:var(--rail);padding-top:var(--topbar);min-height:100vh}
.page{padding:22px 24px 34px;max-width:1600px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.page-title h1{font-size:23px;margin:0;font-weight:760;letter-spacing:-.3px}
.page-title p{font-size:12.5px;color:var(--muted);margin:5px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;height:36px;padding:0 13px;font-size:12px;font-weight:680;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:#b9c6d4;background:#fafcfe}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--red);border-color:#f1c7c9;background:#fff9f9}
.btn.small{height:29px;padding:0 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;padding:0;border-radius:7px}

/* Shared UI */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{min-height:43px;border-bottom:1px solid var(--line2);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:730}
.card-body{padding:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:14px}
.kpi{padding:14px;position:relative;min-height:108px}
.kpi-label{color:var(--muted);font-size:11px}
.kpi-value{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.4px}
.kpi-sub{font-size:10.5px;color:var(--muted);margin-top:8px}
.kpi-icon{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:9px;background:#edf8f7;color:var(--teal);display:grid;place-items:center}
.kpi-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.grid-2{display:grid;grid-template-columns:1.3fr .7fr;gap:13px}
.grid-even{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.small{font-size:11px}
.micro{font-size:10px}
.link{color:#087f79;font-weight:700;text-decoration:none;cursor:pointer}
.sep{height:1px;background:var(--line2);margin:12px 0}
.note{padding:10px 12px;border-radius:7px;background:#f1f8f8;border:1px solid #d7eeee;color:#276562;font-size:11px}
.warning{background:#fff7e9;border-color:#f4dfb7;color:#8d5c10}
.errorbox{background:#fff2f2;border-color:#f0c8c8;color:#a52c31}
.successbox{background:#effaf3;border-color:#c9ead6;color:#23723e}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.green{color:#147b3d;background:#e9f8ef;border-color:#d5f0df}
.pill.red{color:#bd3238;background:#fff0f0;border-color:#fad5d6}
.pill.amber{color:#a46200;background:#fff6e6;border-color:#f6e0b3}
.pill.teal{color:#087f79;background:#e8f8f6;border-color:#cceee9}
.pill.gray{color:#647184;background:#f1f4f7;border-color:#e4e9ee}
.pill.blue{color:#245fac;background:#edf4ff;border-color:#d8e7ff}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:currentColor}

/* Controls */
.toolbar{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.input,.select,.textarea{border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--text);outline:0;font-size:12px}
.input,.select{height:35px;padding:0 10px}
.input:focus,.select:focus,.textarea:focus{border-color:#69cfc8;box-shadow:0 0 0 3px rgba(17,184,174,.08)}
.textarea{padding:9px 10px;min-height:90px;resize:vertical}
.search-input{min-width:260px;flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:grid;gap:5px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:10.5px;color:#5d6b80;font-weight:700}
.form-field input,.form-field select,.form-field textarea{width:100%}

/* Tables */
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th{background:#f7f9fb;color:#68778c;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.35px;font-weight:760;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#fbfdfd}
tbody tr.row-click{cursor:pointer}
.product-main{font-weight:700;max-width:360px}
.product-sub{font-size:9.5px;color:var(--muted);margin-top:2px}
.price{font-variant-numeric:tabular-nums;font-weight:650}
.checkbox{accent-color:var(--teal)}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--muted);font-size:10.5px}
.pagination{display:flex;gap:4px}
.pagebtn{min-width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:10.5px}
.pagebtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Dashboard */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick-action{padding:13px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left}
.quick-action:hover{border-color:#9fded9;background:#fbffff}
.quick-action strong{display:block;font-size:12px}
.quick-action span{font-size:10.5px;color:var(--muted);display:block;margin-top:3px}
.bar-row{display:grid;grid-template-columns:150px 1fr 50px;align-items:center;gap:9px;margin:8px 0;font-size:10.5px}
.bar-track{height:8px;background:#edf2f5;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),#58d5cb);border-radius:6px}
.activity{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}
.activity-icon{width:28px;height:28px;border-radius:7px;background:#edf8f7;color:#087f79;display:grid;place-items:center}

/* Brand/category */
.entity-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.entity-card{padding:14px;cursor:pointer;min-height:138px;transition:.15s}
.entity-card:hover{transform:translateY(-2px);border-color:#a6deda;box-shadow:0 7px 18px rgba(15,72,91,.08)}
.entity-logo{width:42px;height:42px;border-radius:9px;background:#edf8f7;color:#087f79;display:grid;place-items:center;font-size:13px;font-weight:850;text-transform:uppercase}
.entity-name{font-weight:760;margin-top:10px;font-size:13px}
.entity-stats{display:flex;gap:12px;margin-top:8px;color:var(--muted);font-size:10px}
.entity-value{margin-top:9px;font-size:11px;font-weight:700}
.hierarchy{display:grid;gap:8px}
.root-category{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.root-row,.sub-row,.leaf-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.root-row{padding:12px;background:#f9fbfc;font-weight:760}
.sub-row{padding:9px 12px 9px 28px;font-weight:680;border-top:1px solid var(--line2)}
.leaf-row{padding:8px 12px 8px 48px;border-top:1px solid var(--line2);font-size:11px}
.root-row:hover,.sub-row:hover,.leaf-row:hover{background:#f0faf9}
.count{margin-left:auto;color:var(--muted);font-size:10px}

/* Import */
.import-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:13px}
.dropzone{border:1.5px dashed #9bcfc9;border-radius:10px;background:#fbffff;min-height:230px;display:grid;place-items:center;text-align:center;padding:24px}
.dropzone.drag{background:#eefafa;border-color:var(--teal)}
.drop-icon{width:58px;height:58px;border-radius:15px;background:#e8f7f5;color:#087f79;display:grid;place-items:center;font-size:25px;margin:auto auto 10px}
.stepper{display:flex;align-items:center;gap:0;margin:8px 0 16px}
.step{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);flex:1}
.step::after{content:"";height:2px;background:#dce5eb;flex:1;margin:0 6px}
.step:last-child::after{display:none}
.step-circle{width:24px;height:24px;border-radius:50%;border:1px solid #cbd6df;background:#fff;display:grid;place-items:center;font-size:10px}
.step.active{color:#087f79;font-weight:750}
.step.active .step-circle,.step.done .step-circle{background:var(--teal);border-color:var(--teal);color:#fff}
.progress{height:8px;background:#e9eef3;border-radius:999px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--teal),#4ed4ca);transition:width .3s}
.preview-table{max-height:330px;overflow:auto}

/* Pricing */
.edit-cell{width:100px;height:29px;border:1px solid transparent;background:transparent;border-radius:5px;padding:0 5px;font-size:11px}
.edit-cell:hover,.edit-cell:focus{border-color:#a7deda;background:#fff;outline:0}
.margin-positive{color:var(--green);font-weight:750}
.margin-negative{color:var(--red);font-weight:750}

/* Drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(6,20,37,.26);z-index:80;opacity:0;pointer-events:none;transition:.15s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:-520px;top:0;bottom:0;width:500px;max-width:94vw;background:#fff;z-index:90;box-shadow:-12px 0 40px rgba(7,23,44,.18);transition:right .22s ease;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.drawer-body{padding:16px 18px;overflow:auto;flex:1}
.drawer-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;gap:8px}
.drawer-product-image{height:175px;background:#f4f7fa;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center}
.drawer-product-image img{max-width:100%;max-height:100%;object-fit:contain}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0}
.tab{border:0;background:transparent;padding:9px 11px;border-bottom:2px solid transparent;color:var(--muted);font-size:11px}
.tab.active{border-color:var(--teal);color:#087f79;font-weight:750}
.modal{position:fixed;z-index:95;left:50%;top:50%;transform:translate(-50%,-46%);width:640px;max-width:92vw;max-height:86vh;background:#fff;border-radius:10px;box-shadow:0 20px 70px rgba(7,23,44,.24);opacity:0;pointer-events:none;transition:.15s;display:flex;flex-direction:column}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-body{padding:16px;overflow:auto}

/* Empty / detail */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-icon{font-size:34px;margin-bottom:8px}
.breadcrumb{font-size:10.5px;color:var(--muted);margin-bottom:8px}
.breadcrumb span{color:#087f79;cursor:pointer}
.detail-header{display:flex;gap:14px;align-items:center}
.detail-logo{width:62px;height:62px;border-radius:13px;background:#eaf8f6;color:#087f79;display:grid;place-items:center;font-weight:850;font-size:18px}
.metric-row{display:flex;gap:24px;margin-top:10px}
.metric-row div strong{display:block;font-size:14px}
.metric-row div span{font-size:10px;color:var(--muted)}

/* Reports */
.report-bars{padding:8px 0}
.report-row{display:grid;grid-template-columns:150px 1fr 72px;gap:10px;align-items:center;padding:7px 0}
.report-name{font-size:11px;font-weight:650}
.report-track{height:12px;background:#eef2f5;border-radius:7px;overflow:hidden}
.report-fill{height:100%;background:linear-gradient(90deg,var(--navy2),var(--teal))}
.report-num{text-align:right;font-size:11px;font-weight:700}

/* Settings / banners */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2);gap:20px}
.setting-row strong{font-size:11.5px}
.setting-row p{margin:3px 0 0;color:var(--muted);font-size:10.5px}
.toggle{width:38px;height:21px;border-radius:20px;background:#cbd5df;position:relative;cursor:pointer;transition:.15s;flex:none}
.toggle::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.15s}
.toggle.on{background:var(--teal)}
.toggle.on::after{left:19px}
.banner-card{overflow:hidden}
.banner-preview{height:110px;background:linear-gradient(120deg,var(--navy),#153d68);color:#fff;padding:17px;position:relative}
.banner-preview::after{content:"";position:absolute;right:-20px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(17,184,174,.2)}
.banner-preview strong{font-size:17px;position:relative;z-index:2}
.banner-preview p{font-size:10px;color:#c8d6e5;max-width:70%;position:relative;z-index:2}
.banner-controls{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}

/* Toast */
.toast-wrap{position:fixed;right:18px;top:88px;z-index:120;display:grid;gap:8px}
.toast{min-width:270px;max-width:380px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;box-shadow:0 12px 30px rgba(7,23,44,.15);padding:11px 13px;font-size:11.5px;animation:toastin .18s ease}
.toast.error{border-left-color:var(--red)}
@keyframes toastin{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}

/* Responsive */
@media(max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .entity-grid{grid-template-columns:repeat(3,1fr)}
  .grid-2,.import-hero{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  :root{--rail:0px}
  .logo-zone{width:190px;padding-left:12px}.logo-zone img{max-width:165px}
  .top-chip,.top-account span{display:none}
  .sidebar{left:-244px;width:244px}
  .sidebar.mobile-open{left:0}
  .sidebar .nav-label,.sidebar .nav-group-label,.sidebar .nav-count{opacity:1}
  .main{margin-left:0}
  .page{padding:16px 12px 28px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .entity-grid{grid-template-columns:1fr 1fr}
  .grid-even,.grid-3{grid-template-columns:1fr}
  .mobile-menu{display:inline-flex!important}
}
@media(max-width:540px){
  .global-search{display:none}
  .kpi-grid,.entity-grid,.quick-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .page-head{display:block}.actions{margin-top:10px}
  .metric-row{flex-wrap:wrap}
}
.mobile-menu{display:none}
</style>
</head>

function pillStatus(p){

function filtersProducts(list=products()){
 let out=list,q=currentFilters.q.trim().toLowerCase();
 if(q) out=out.filter(p=>[p.name,p.sku,p.mpn,p.brand,p.category].some(v=>String(v||"").toLowerCase().includes(q)));
 if(currentFilters.brand) out=out.filter(p=>p.brand===currentFilters.brand);
 if(currentFilters.category) out=out.filter(p=>p.category===currentFilters.category);
 if(currentFilters.status==="published")out=out.filter(p=>p.is_published);
 if(currentFilters.status==="draft")out=out.filter(p=>!p.is_published);
 if(currentFilters.status==="backorder")out=out.filter(p=>p.stock_status==="backorder");
 if(currentFilters.status==="in_stock")out=out.filter(p=>p.stock_status==="in_stock");

  const details=[
   `Checking ${Math.min(300,Math.round(importProgress*3))}/300 rows and field formats.`,

   `Writing ${Math.min(300,Math.round((importProgress-40)*5))}/300 product records in batches.`,

  ];
  document.getElementById("importStageText").textContent=importStages[importStage]+"...";

 ${[["Publish valid imports by default","New verified product rows may be published immediately",true],["Download external product images","Store imported image URLs in the product-images bucket",true],["Low-stock alerts","Flag products at or below reorder level",true],["Require cost price before publish","Keep optional during onboarding",false]].map(([a,b,on])=>`<div class="setting-row"><div><strong>${a}</strong><p>${b}</p></div><div class="toggle ${on?"on":""}" onclick="this.classList.toggle('on')"></div></div>`).join("")}
 <div class="setting-row"><div><strong>Product image bucket</strong><p>Server-side image storage</p></div><code>product-images</code></div>
 </div></div></div>
 <div class="card" style="margin-top:13px"><div class="card-head"><span>System architecture</span></div><div class="card-body grid-3">
 <div class="note"><strong>Storefront</strong><br>Product discovery, cart, customer account and quote requests.</div><div class="note"><strong>Admin</strong><br>Catalogue, inventory, pricing, orders and quote management.</div><div class="note"><strong>Data</strong><br>PostgreSQL/Supabase catalogue with role-protected administrative access.</div>
 </div></div>`;
}
function usersPage(){
 const users=[["Admin","info@cetertechnologies.com","Administrator","Active"],["Catalogue Manager","catalogue@cetertechnologies.com","Catalogue","Active"],["Operations","operations@cetertechnologies.com","Orders & Inventory","Active"],["Viewer","viewer@cetertechnologies.com","Read only","Invited"]];
 return head("Users & Roles","Keep admin access separate from customer accounts.",
 `<button class="btn primary" onclick="toast('Invite form opened in mockup')">Invite admin user</button>`) +
 `<div class="card"><div class="card-head"><span>Admin users</span><span class="small muted">Mock role layout</span></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${u[0]}</strong></td><td>${u[1]}</td><td>${u[2]}</td><td><span class="pill ${u[3]==="Active"?"green":"amber"}">${u[3]}</span></td><td><button class="btn small" onclick="toast('User editor opened')">Edit</button></td></tr>`).join("")}</tbody></table></div></div>`;
}

function render(){
 parseHash();renderNav();
 let content;
 switch(currentRoute){
  case "products":content=productsPage();break;case "categories":content=categoriesPage();break;case "category-detail":content=categoryDetail(routeParam);break;
  case "brands":content=brandsPage();break;case "brand-detail":content=brandDetail(routeParam);break;case "imports":content=importsPage();break;
  case "pricing":content=pricingPage();break;case "inventory":content=inventoryPage();break;case "orders":content=ordersPage();break;
  case "quotes":content=quotesPage();break;case "customers":content=customersPage();break;case "payments":content=paymentsPage();break;
  case "banners":content=bannersPage();break;case "reports":content=reportsPage();break;case "settings":content=settingsPage();break;case "users":content=usersPage();break;
  default:content=dashboard();
 }
 document.getElementById("app").innerHTML=content;
 if(currentRoute==="pricing")renderPricingRows();if(currentRoute==="inventory")renderStockRows();
}

function openProduct(slug){
 const p=products().find(x=>x.slug===slug);if(!p)return;
 const img=(String(p.images||"").split(";")[0]||"");
 const roots=productRoot(p);
 openDrawer("Edit product",`<div class="drawer-product-image">${img?`<img src="${esc(img)}" onerror="this.style.display='none';this.parentElement.innerHTML='🖨️'">`:"🖨️"}</div>
 <div class="tabs"><button class="tab active">Listing</button><button class="tab">Pricing</button><button class="tab">Stock</button></div>
 <div class="form-grid">
  <div class="form-field full"><label>Product name</label><input id="edName" class="input" value="${esc(p.name)}"></div>
  <div class="form-field"><label>Brand</label><select id="edBrand" class="select">${[...new Set(products().map(x=>x.brand))].map(b=>`<option value="${b}" ${b===p.brand?"selected":""}>${brandName(b)}</option>`).join("")}</select></div>
  <div class="form-field"><label>Category</label><select id="edCategory" class="select">${[...new Set(products().map(x=>x.category))].sort().map(c=>`<option value="${c}" ${c===p.category?"selected":""}>${titleSlug(c)}</option>`).join("")}</select></div>
  <div class="form-field"><label>MPN / model</label><input id="edMpn" class="input" value="${esc(p.mpn||"")}"></div>
  <div class="form-field"><label>SKU</label><input id="edSku" class="input" value="${esc(p.sku||"")}"></div>
  <div class="form-field"><label>Cost price (KSh)</label><input id="edCost" class="input" type="number" value="${p.cost_price_kes||0}"></div>
  <div class="form-field"><label>Selling price (KSh)</label><input id="edPrice" class="input" type="number" value="${p.price_kes||0}"></div>
  <div class="form-field"><label>Stock quantity</label><input id="edStock" class="input" type="number" value="${p.stock_quantity||0}"></div>
  <div class="form-field"><label>Stock status</label><select id="edStatus" class="select"><option value="in_stock" ${p.stock_status==="in_stock"?"selected":""}>In stock</option><option value="backorder" ${p.stock_status==="backorder"?"selected":""}>Backorder</option><option value="out_of_stock" ${p.stock_status==="out_of_stock"?"selected":""}>Out of stock</option></select></div>
  <div class="form-field full"><label>Description</label><textarea id="edDesc" class="textarea">${esc(p.description||"")}</textarea></div>
  <div class="form-field full"><label>Image URLs / stored URLs</label><textarea id="edImages" class="textarea">${esc(p.images||"")}</textarea></div>
  <div class="form-field full"><label>Specifications</label><textarea id="edSpecs" class="textarea">${esc(p.specs||"")}</textarea></div>
  <div class="form-field"><label>Published</label><select id="edPub" class="select"><option value="true" ${p.is_published?"selected":""}>Published</option><option value="false" ${!p.is_published?"selected":""}>Draft</option></select></div>
  <div class="form-field"><label>Featured</label><select id="edFeatured" class="select"><option value="false" ${!p.is_featured?"selected":""}>No</option><option value="true" ${p.is_featured?"selected":""}>Yes</option></select></div>
 </div>
 <div class="note" style="margin-top:12px"><strong>${esc(roots.root)}</strong> → ${esc(roots.sub)} → ${esc(titleSlug(p.category))}</div>`,
 `<button class="btn danger" onclick="saveOverride('${esc(p.slug)}',{is_published:false});toast('Product moved to draft');closeDrawer();render()">Unpublish</button><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="saveProductEdit('${esc(p.slug)}')">Save product</button>`);
}
function saveProductEdit(slug){
 const patch={name:document.getElementById("edName").value,brand:document.getElementById("edBrand").value,category:document.getElementById("edCategory").value,mpn:document.getElementById("edMpn").value,sku:document.getElementById("edSku").value,cost_price_kes:Number(document.getElementById("edCost").value),price_kes:Number(document.getElementById("edPrice").value),stock_quantity:Number(document.getElementById("edStock").value),stock_status:document.getElementById("edStatus").value,description:document.getElementById("edDesc").value,images:document.getElementById("edImages").value,specs:document.getElementById("edSpecs").value,is_published:document.getElementById("edPub").value==="true",is_featured:document.getElementById("edFeatured").value==="true"};
 saveOverride(slug,patch);toast("Product updated");closeDrawer();render();
}
function openNewProduct(brand=""){
 const cats=[...new Set(products().map(p=>p.category))].sort(),brands=[...new Set(products().map(p=>p.brand))].sort();
 openDrawer("Add product",`<div class="form-grid"><div class="form-field full"><label>Product name</label><input id="newName" class="input" placeholder="Product name"></div><div class="form-field"><label>Brand</label><select id="newBrand" class="select">${brands.map(b=>`<option value="${b}" ${brand===b?"selected":""}>${brandName(b)}</option>`).join("")}</select></div><div class="form-field"><label>Category</label><select id="newCategory" class="select">${cats.map(c=>`<option value="${c}">${titleSlug(c)}</option>`).join("")}</select></div><div class="form-field"><label>MPN</label><input id="newMpn" class="input"></div><div class="form-field"><label>SKU</label><input id="newSku" class="input"></div><div class="form-field"><label>Cost price</label><input id="newCost" type="number" class="input" value="0"></div><div class="form-field"><label>Selling price</label><input id="newPrice" type="number" class="input" value="0"></div><div class="form-field"><label>Stock</label><input id="newStock" type="number" class="input" value="0"></div><div class="form-field full"><label>Description</label><textarea id="newDesc" class="textarea"></textarea></div><div class="form-field full"><label>Image URLs</label><textarea id="newImages" class="textarea"></textarea></div></div>`,
 `<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="createMockProduct()">Create product</button>`);
}
function createMockProduct(){
 const name=document.getElementById("newName").value.trim();if(!name){toast("Product name is required","error");return}
 const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString().slice(-5);
 const p={name,slug,description:document.getElementById("newDesc").value,category:document.getElementById("newCategory").value,brand:document.getElementById("newBrand").value,mpn:document.getElementById("newMpn").value,sku:document.getElementById("newSku").value,price_kes:Number(document.getElementById("newPrice").value),cost_price_kes:Number(document.getElementById("newCost").value),supplier_name:"",supplier_lead_time_days:null,reorder_level:0,reorder_quantity:0,condition:"new",stock_status:Number(document.getElementById("newStock").value)>0?"in_stock":"backorder",stock_quantity:Number(document.getElementById("newStock").value),images:document.getElementById("newImages").value,specs:"",is_featured:false,is_published:true};
 customProducts.push(p);localStorage.setItem("ceter-mock-custom-products",JSON.stringify(customProducts));closeDrawer();toast("Mock product created");setRoute("products");
}
function openDrawer(title,body,foot=""){document.getElementById("drawerTitle").textContent=title;document.getElementById("drawerBody").innerHTML=body;document.getElementById("drawerFoot").innerHTML=foot;document.getElementById("overlay").classList.add("open");document.getElementById("drawer").classList.add("open")}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("open")}
function showModal(title,body,foot=""){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalFoot").innerHTML=foot;document.getElementById("overlay").classList.add("open");document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("overlay").classList.remove("open")}

function csvDownload(name,rows){
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function downloadProductCSV(){const h=["name","slug","description","category","brand","mpn","sku","price_kes","cost_price_kes","supplier_name","supplier_lead_time_days","reorder_level","reorder_quantity","condition","stock_status","stock_quantity","images","specs","is_featured","is_published"];csvDownload("ceter-product-import-template.csv",[h,...products().slice(0,5).map(p=>h.map(k=>p[k]??""))]);toast("Template CSV generated")}
function downloadCategoryCSV(){let rows=[["main_category","subcategory","leaf_category","leaf_slug","products"]];for(const [root,subs] of Object.entries(hierarchy))for(const [sub,leaves] of Object.entries(subs))for(const leaf of leaves)rows.push([root,sub,titleSlug(leaf),leaf,products().filter(p=>p.category===leaf).length]);csvDownload("ceter-category-map.csv",rows)}
function downloadBrandsCSV(){let rows=[["brand","slug","products","stock_value"]];for(const b of [...new Set(products().map(p=>p.brand))]){let l=products().filter(p=>p.brand===b);rows.push([brandName(b),b,l.length,l.reduce((a,p)=>a+p.price_kes*p.stock_quantity,0)])}csvDownload("ceter-brands.csv",rows)}
function downloadInventoryCSV(){csvDownload("ceter-inventory.csv",[["sku","product","brand","category","stock_quantity","stock_status","reorder_level","reorder_quantity","cost_price_kes","price_kes"],...products().map(p=>[p.sku,p.name,brandName(p.brand),titleSlug(p.category),p.stock_quantity,p.stock_status,p.reorder_level,p.reorder_quantity,p.cost_price_kes,p.price_kes])])}
function downloadOrdersCSV(){csvDownload("ceter-orders-mock.csv",[["order","date","customer","payment","total","status"],...mockOrders.map(o=>[o.id,o.date,o.customer,o.payment,o.total,o.status])])}

document.getElementById("overlay").addEventListener("click",()=>{closeDrawer();closeModal()});
document.getElementById("mobileMenuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("mobile-open"));
window.addEventListener("hashchange",render);
document.getElementById("globalSearch").addEventListener("input",function(){
 const q=this.value.trim().toLowerCase(),host=document.getElementById("globalSearchResults");
 if(q.length<2){host.classList.add("hidden");return}
 const rs=products().filter(p=>[p.name,p.sku,p.mpn,p.brand].some(v=>String(v||"").toLowerCase().includes(q))).slice(0,10);
 host.innerHTML=rs.length?rs.map(p=>`<div class="search-result" onclick="openProduct('${esc(p.slug)}');document.getElementById('globalSearchResults').classList.add('hidden')"><strong>${esc(p.name)}</strong><div class="micro muted">${brandName(p.brand)} · ${esc(p.sku||p.mpn||"")} · ${fmtMoney(p.price_kes)}</div></div>`).join(""):`<div class="search-result muted">No matching products.</div>`;
 host.classList.remove("hidden");
});
document.addEventListener("click",e=>{if(!e.target.closest(".global-search"))document.getElementById("globalSearchResults").classList.add("hidden")});
render();
</script>
